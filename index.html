<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd23f">
  <meta name="description" content="Carte interactive des bars et restaurants de Bordeaux pour la réception de l'hôtel.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bordeaux à la carte">
  <title>Bordeaux à la carte</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preload" href="fonts/bangers-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Capture au plus tôt la proposition d'installation du navigateur (Chrome, Edge, Android…)
    window.__bip = null;
    addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; dispatchEvent(new Event('bip-ready')); });
  </script>
</head>
<body>
  <div id="app" class="is-loading">

    <!-- Panneau de gauche : recherche, filtres, liste -->
    <aside id="panel" class="panel" data-i18n-aria="panel.label">
      <button class="sheet-handle" id="sheetHandle" data-i18n-aria="sheet"><span></span></button>
      <header class="brand">
        <div class="brand__logo" aria-hidden="true"><span>🍽️</span></div>
        <div class="brand__text">
          <h1><span data-i18n="brand.a">Bordeaux</span> <span class="brand__b" data-i18n="brand.b">à la carte !</span></h1>
          <p class="brand__sub"><span data-i18n="brand.from">Départ :</span> <b>🏨 Ibis Euratlantique</b></p>
        </div>
        <div class="brand__btns">
          <button id="langBtn" class="btn btn--small" data-i18n="lang.btn" data-i18n-title="lang.title">🌐 EN</button>
          <button id="installBtn" class="btn btn--small btn--pop" data-i18n="install" hidden>⬇ Installer</button>
        </div>
      </header>

      <div class="search">
        <span class="search__icon" aria-hidden="true">🔎</span>
        <input id="q" type="search" autocomplete="off" data-i18n-ph="search.ph" data-i18n-aria="search.label" placeholder="Nom, cuisine, rue…">
        <button id="clearQ" class="search__clear" data-i18n-aria="clear" hidden>✕</button>
      </div>

      <div class="when" id="when" role="group" data-i18n-aria="when.group">
        <span class="when__label" data-i18n="when.label">🕒 Statut</span>
        <button data-when="now" class="on" data-i18n="when.now">Maintenant</button>
        <button data-when="midi" data-i18n="when.midi">Midi</button>
        <button data-when="soir" data-i18n="when.soir">20h</button>
        <button data-when="tard" data-i18n="when.tard">23h</button>
        <label class="when__custom" data-i18n-title="when.custom">
          📅<input type="datetime-local" id="whenCustom" data-i18n-aria="when.custom">
        </label>
      </div>

      <section class="filters" data-i18n-aria="filters">
        <div class="chips" id="typeChips"></div>
        <div class="chips chips--cuisine" id="cuisineChips"></div>
        <div class="filters__row">
          <div class="seg" id="priceSeg" role="group" data-i18n-aria="price.group">
            <button data-p="1" data-i18n-title="price.1">€</button>
            <button data-p="2" data-i18n-title="price.2">€€</button>
            <button data-p="3" data-i18n-title="price.3">€€€</button>
          </div>
          <label class="walkmax">🚶
            <select id="walkMax" data-i18n-aria="walk.label"></select>
          </label>
        </div>
        <div class="chips chips--toggles" id="toggleChips">
          <button data-t="open" data-i18n="tg.open">🟢 Ouvert</button>
          <button data-t="fav" data-i18n="tg.fav">❤️ Coups de cœur</button>
          <button data-t="ts" data-i18n="tg.ts">☀️ Terrasse</button>
          <button data-t="vg" data-i18n="tg.vg">🥗 Végé</button>
          <button data-t="wc" data-i18n="tg.wc">♿ Accessible</button>
        </div>
      </section>

      <div class="results-head">
        <b id="count">…</b>
        <select id="sort" data-i18n-aria="sort.label">
          <option value="dist" data-i18n="sort.dist">Plus proches</option>
          <option value="open" data-i18n="sort.open">Ouverts d'abord</option>
          <option value="stars" data-i18n="sort.stars">Mieux notés</option>
          <option value="name" data-i18n="sort.name">A → Z</option>
        </select>
        <button id="resetBtn" class="btn btn--ghost btn--small" data-i18n-title="reset">↺</button>
      </div>
      <ul id="list" class="list" aria-live="polite"></ul>
    </aside>

    <!-- Carte -->
    <main id="mapWrap" class="map-wrap">
      <div id="map" data-i18n-aria="map.label"></div>
      <div class="map-tools">
        <button id="btnRandom" class="btn btn--pop btn--big" data-i18n="random" data-i18n-title="random.title">🎲 Surprends-moi !</button>
        <button id="btnLocate" class="btn btn--round" data-i18n-title="loc.title" hidden>📍</button>
        <button id="btnHotel" class="btn btn--round" data-i18n-title="hotel.title">🏨</button>
        <button id="btnSettings" class="btn btn--round" data-i18n-title="settings.title">⚙️</button>
      </div>
      <div class="legend" data-i18n-aria="legend">
        <span><i class="light light--open"></i><span data-i18n="st.open">Ouvert</span></span>
        <span><i class="light light--closing"></i><span data-i18n="st.closing">Ferme bientôt</span></span>
        <span><i class="light light--closed"></i><span data-i18n="st.closed">Fermé</span></span>
        <span><i class="light light--unknown"></i><span data-i18n="st.unknown">Inconnu</span></span>
      </div>
      <div id="whenBanner" class="when-banner" hidden></div>
      <div id="hoverCard" class="hover-card" hidden></div>
      <div id="toast" class="toast" role="status"></div>
      <div class="loader" id="loader"><div class="loader__burst" data-i18n="loading">CHARGEMENT…</div></div>
    </main>

    <!-- Fiche détaillée -->
    <section id="detail" class="detail" aria-hidden="true" data-i18n-aria="d.label"></section>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__box" role="dialog" aria-modal="true"></div>
  </div>
  <div id="slot" class="slot" hidden></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bordeaux à la carte — affiche A3</title>
  <!-- Grande affiche pour l'accueil : les quartiers gourmands de Bordeaux sur le plan BD de l'application, et le QR code.
       Aucun nom d'établissement (l'affiche ne vieillit pas) : les adresses sont dans l'application.
       Textes en français suivis de l'anglais, sauf les descriptions des quartiers.
       A3 par défaut ; affiche-quartiers.html?a2 donne la version murale A2 (la même page agrandie √2 fois).
       Le plan est dessiné ici en vectoriel à partir de data/basemap.json, data/tram.json et data/venues.json.
       Imprimer depuis le navigateur (marges : aucune), ou régénérer les PDF avec scripts/affiche-quartiers.sh. -->
  <style id="page">@page { size: A3; margin: 0; }</style><!-- A2 : « size: A2 » n'existe pas en CSS, d'où 420mm 594mm dans le script -->
  <style>
    @font-face { font-family: 'Bangers'; src: url(fonts/bangers-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
    @font-face { font-family: 'Bangers'; src: url(fonts/bangers-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C4, U+A720-A7FF; }
    @font-face { font-family: 'Comic Neue'; font-weight: 400; src: url(fonts/comicneue-400.woff2) format('woff2'); }
    @font-face { font-family: 'Comic Neue'; font-weight: 700; src: url(fonts/comicneue-700.woff2) format('woff2'); }
    :root {
      --ink: #1b1b1b; --paper: #fff6df; --paper-2: #fdebc1; --yellow: #ffd23f; --red: #ff5a36; --blue: #3aa8ff;
      --titre: 'Bangers', Impact, sans-serif; --texte: 'Comic Neue', 'Comic Sans MS', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #6d6a63; font-family: var(--texte); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .affiche {
      position: relative; width: 297mm; height: 420mm; margin: 10mm auto; padding: 9mm 10mm 7mm;
      background: var(--paper-2); display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    .en { font-style: italic; }

    /* ---------- plan ---------- */
    .carte { position: relative; flex: none; border: .9mm solid var(--ink); border-radius: 3mm; overflow: hidden; background: #fff3d6; box-shadow: 1.6mm 1.6mm 0 var(--ink); }
    .carte svg { display: block; width: 100%; height: auto; }

    .bulle { position: absolute; background: #fff; border: .7mm solid var(--ink); border-radius: 2.5mm; box-shadow: 1.1mm 1.1mm 0 var(--ink); }
    .titre { left: 5mm; top: 5mm; width: 104mm; padding: 4mm 5mm 4.4mm; transform: rotate(-1.2deg); }
    h1 { margin: 0; font: 400 41pt/0.92 var(--titre); letter-spacing: .02em; text-shadow: .7mm .7mm 0 var(--yellow), 1.2mm 1.2mm 0 var(--ink); }
    .titre .sous { margin: 3mm 0 0; font-size: 13.5pt; font-weight: 700; line-height: 1.1; }
    .titre .sous .en { display: block; margin-top: .6mm; font-size: 12pt; font-weight: 400; }
    .titre .vers-app { margin: 2.4mm 0 0; padding-top: 2mm; border-top: .4mm dashed var(--ink); font-size: 8.6pt; font-weight: 700; line-height: 1.25; color: #c2410c; }

    .legende { left: 5mm; bottom: 5mm; padding: 3mm 3.6mm; font-size: 8pt; line-height: 1.15; }
    .legende b { display: block; margin-bottom: 1.4mm; font: 400 12pt var(--titre); letter-spacing: .04em; }
    .legende ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.1mm; }
    .legende li { display: flex; align-items: center; gap: 1.8mm; font-weight: 700; }
    .legende li span { font-weight: 400; }
    .legende i { flex: none; width: 2.8mm; height: 2.8mm; border-radius: 50%; border: .3mm solid var(--ink); }
    .legende i.tram { width: 6mm; height: 1.6mm; border-radius: 1mm; }
    .legende i.q { width: 4.4mm; height: 4.4mm; background: var(--yellow); display: grid; place-items: center; font: 400 7pt var(--titre); border-width: .4mm; }
    .legende i.h { width: 4.4mm; height: 4.4mm; background: var(--red); border-radius: 1mm; color: #fff; display: grid; place-items: center; font: 400 7.5pt var(--titre); }

    .nord { position: absolute; right: 5mm; top: 5mm; display: grid; justify-items: center; gap: 1mm; font: 400 12pt var(--titre); }
    .nord svg { width: 9mm; height: 9mm; }
    .echelle { position: absolute; right: 5mm; bottom: 5mm; font-size: 7.5pt; font-weight: 700; text-align: center; }
    .echelle i { display: block; height: 2mm; margin-bottom: .8mm; border: .4mm solid var(--ink); border-top: 0; background: linear-gradient(90deg, var(--ink) 50%, #fff 50%); }

    /* ---------- quartiers ---------- */
    .quartiers { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr 1fr; gap: 4mm 3.6mm; margin-top: 5.5mm; min-height: 0; }
    .q { position: relative; padding: 2.6mm 3mm 2.6mm; background: #fff; border: .6mm solid var(--ink); border-radius: 2.5mm; box-shadow: 1mm 1mm 0 var(--ink); }
    .q .num { position: absolute; left: -2mm; top: -2.4mm; width: 7.4mm; height: 7.4mm; border: .55mm solid var(--ink); border-radius: 50%; background: var(--yellow); display: grid; place-items: center; font: 400 12pt/1 var(--titre); }
    .q h3 { margin: 0 0 0 5mm; font: 400 15.5pt/1 var(--titre); letter-spacing: .03em; }
    .q .infos { margin: 1.6mm 0 0; font-size: 8pt; font-weight: 700; line-height: 1.3; color: #444; }
    .q .infos span { white-space: nowrap; }
    .q p { margin: 1.8mm 0 0; font-size: 9.6pt; line-height: 1.24; }

    .qr-carte { background: var(--yellow); text-align: center; padding: 2.4mm 2.4mm 2mm; }
    .qr-carte .appel { margin: 0; font: 400 13.5pt/1 var(--titre); letter-spacing: .03em; }
    .qr-carte .appel-en { margin: .8mm 0 0; font-size: 8.2pt; font-weight: 700; font-style: italic; line-height: 1.1; }
    .qr { width: 29mm; height: 29mm; margin: 1.6mm auto 0; padding: 1.4mm; background: #fff; border: .5mm solid var(--ink); border-radius: 1.5mm; }
    .qr svg { display: block; width: 100%; height: 100%; }
    .qr-carte .url { margin: 1.2mm 0 0; font-size: 6.6pt; font-weight: 700; overflow-wrap: anywhere; }

    .pied { flex: none; display: flex; justify-content: space-between; gap: 6mm; margin-top: 3.4mm; font-size: 6.6pt; color: #5b5346; }

    .boutons { display: flex; justify-content: center; gap: 10px; margin: 0 0 14px; }
    .boutons button { padding: 9px 18px; border: 2px solid var(--ink); border-radius: 999px; background: var(--yellow); font: 400 17px var(--titre); letter-spacing: .04em; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
    /* version murale A2 (?a2) : la même affiche, agrandie √2 fois */
    html.a2 .affiche { zoom: 1.41421; }
    @media print {
      body { background: none; }
      .affiche { margin: 0; box-shadow: none; }
      .boutons { display: none; }
    }
  </style>
</head>
<body>
  <main class="affiche">
    <div class="carte">
      <svg id="plan" aria-label="Plan de Bordeaux avec les bars et restaurants et les quartiers numérotés"></svg>
      <div class="bulle titre">
        <h1>Bordeaux<br>à la carte !</h1>
        <p class="sous">Où manger et boire, quartier par quartier<span class="en">Where to eat &amp; drink, area by area</span></p>
        <p class="vers-app">Every address, live opening hours and routes from the hotel, in English: scan the QR code, bottom right.</p>
      </div>
      <div class="nord"><svg viewBox="0 0 24 24"><path d="M12 1.5 18 21 12 17 6 21z" fill="#ffd23f" stroke="#1b1b1b" stroke-width="1.6" stroke-linejoin="round"/></svg>N</div>
      <div class="bulle legende" id="legende"></div>
      <div class="echelle" id="echelle"></div>
    </div>

    <section class="quartiers" id="quartiers"></section>

    <footer class="pied">
      <span id="hotel"></span>
      <span id="sources"></span>
    </footer>
  </main>
  <div class="boutons"><button onclick="print()" id="imprimer">Imprimer l’affiche (A3)</button></div>

  <script src="vendor/qrcode.js"></script>
  <script type="module">
    import { HOTEL, TYPES } from './js/config.js';
    const URL_SITE = 'https://ubik2077.github.io/bordeaux-a-la-carte/?client'; // version clients (voir README)

    // ?a2 : version murale (format de page A2, affiche agrandie par le CSS)
    if (new URLSearchParams(location.search).has('a2')) {
      document.documentElement.classList.add('a2');
      document.getElementById('page').textContent = '@page { size: 420mm 594mm; margin: 0; }';
      document.title = 'Bordeaux à la carte — affiche A2';
      document.getElementById('imprimer').textContent = 'Imprimer l’affiche (A2)';
    }

    // Les quartiers : centre (badge sur le plan), accès depuis l'hôtel et description.
    // Le nombre d'adresses est compté dans data/venues.json (lieux à moins de 650 m du centre, rattachés au plus proche).
    // tram : [ligne(s), arrêt] ou deux étapes ; marche : minutes à pied depuis l'hôtel (estimation).
    const QUARTIERS = [
      { id: 'saintjean', nom: 'Saint-Jean · Belcier', at: [44.8248, -0.5527], marche: 5, tram: null,
        texte: 'Le quartier de l’hôtel et de la gare, en plein renouveau : brasseries, pizzerias et snacks pour un repas sans traverser la ville.' },
      { id: 'capucins', nom: 'Saint-Michel · Capucins', at: [44.8318, -0.5675], marche: 15, tram: [['C', 'Saint-Michel']],
        texte: 'Le « ventre de Bordeaux » : le marché des Capucins, huîtres et vin blanc au comptoir le week-end, et autour de la basilique, les cuisines du monde.' },
      { id: 'victoire', nom: 'Victoire', at: [44.8300, -0.5745], marche: 25, tram: null,
        texte: 'Le quartier étudiant : bars animés autour de la place et de son arc, burgers, kebabs et petits prix jusque tard le soir.' },
      { id: 'saintpierre', nom: 'Saint-Pierre', at: [44.8395, -0.5712], marche: 30, tram: [['C', 'Place de la Bourse']],
        texte: 'Le cœur ancien, entre la Bourse et la Grosse Cloche : ruelles piétonnes, terrasses sur les places, bistrots et cuisine du Sud-Ouest.' },
      { id: 'peyberland', nom: 'Pey-Berland', at: [44.8370, -0.5770], marche: 30, tram: [['F', 'Hôtel de Ville']],
        texte: 'Autour de la cathédrale et de l’hôtel de ville : cafés, coffee shops et salons de thé, pour une pause ou un déjeuner entre deux visites.' },
      { id: 'grandshommes', nom: 'Grands Hommes · Triangle d’or', at: [44.8430, -0.5770], marche: 40, tram: [['C', 'Quinconces']],
        texte: 'Le Bordeaux chic, du Grand Théâtre aux Quinconces : grandes brasseries, tables gastronomiques et bars à vin sous les façades du XVIIIᵉ.' },
      { id: 'chartrons', nom: 'Chartrons', at: [44.8550, -0.5700], marche: 55, tram: [['C', 'Camille Godard']],
        texte: 'L’ancien quartier des négociants en vin : antiquaires et bistrots rue Notre-Dame, brunchs, et le marché des quais le dimanche matin.' },
      { id: 'bastide', nom: 'La Bastide · Darwin', at: [44.8480, -0.5590], marche: 35, tram: null, pont: true,
        texte: 'Sur la rive droite, Darwin, ancienne caserne devenue lieu alternatif : restaurant bio, épicerie, skatepark, et la plus belle vue sur les quais.' },
      { id: 'bassins', nom: 'Bassins à flot', at: [44.8650, -0.5540], marche: null, tram: [['C', 'Quinconces'], ['B', 'La Cité du Vin']],
        texte: 'Le quartier neuf des anciens bassins du port : les Halles de Bacalan au pied de la Cité du Vin, et des terrasses au bord de l’eau.' },
    ];

    // cadre du plan (degrés) et repères
    const B = { o: -0.600, e: -0.532, s: 44.8205, n: 44.871 };
    const KX = 111320 * Math.cos(44.845 * Math.PI / 180), KY = 110540;   // mètres par degré
    const VW = 1000, VH = Math.round(VW * ((B.n - B.s) * KY) / ((B.e - B.o) * KX));
    const M = VW / ((B.e - B.o) * KX);                                    // unités du plan par mètre
    const px = ([la, lo]) => [((lo - B.o) * KX * M), ((B.n - la) * KY * M)];
    const f1 = (v) => Math.round(v * 10) / 10;
    const dist = (a, b) => Math.hypot((a[1] - b[1]) * KX, (a[0] - b[0]) * KY);

    const [bm, tram, ven] = await Promise.all(['data/basemap.json', 'data/tram.json', 'data/venues.json'].map((u) => fetch(u).then((r) => r.json())));

    // ---------- dessin du plan ----------
    const svg = document.getElementById('plan');
    svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
    const parts = [];
    const dedans = (pts) => pts.some(([la, lo]) => la > B.s - 0.01 && la < B.n + 0.01 && lo > B.o - 0.01 && lo < B.e + 0.01);
    const chemin = (pts, ferme) => 'M' + pts.map((p) => px(p).map(f1).join(' ')).join('L') + (ferme ? 'Z' : '');
    const anneaux = (a) => (typeof a[0][0] === 'number' ? [a] : a.flatMap(anneaux));
    const lignes = (liste) => liste.filter(dedans).map((l) => chemin(l)).join('');
    const surfaces = (liste) => anneaux(liste).filter(dedans).map((r) => chemin(r, true)).join('');

    parts.push(`<path d="${surfaces(bm.green)}" fill="#9bd76e" stroke="#2f5d1e" stroke-width=".8" stroke-opacity=".6" fill-rule="evenodd"/>`);
    parts.push(`<path d="${surfaces(bm.water)}" fill="#6fc7f0" stroke="#1b1b1b" stroke-width="1.6" fill-rule="evenodd"/>`);
    const rail = lignes(bm.rail);
    parts.push(`<path d="${rail}" fill="none" stroke="#5a5a5a" stroke-width="2.2" stroke-opacity=".55"/><path d="${rail}" fill="none" stroke="#f6ecd4" stroke-width="1" stroke-dasharray="3 4"/>`);
    // routes : contours noirs puis remplissages, des plus petites aux plus grandes
    const LARG = { 5: [1.3, .7], 4: [1.6, .8], 3: [2.7, 1.5], 2: [3.6, 2.2], 1: [4.4, 2.9] };
    const REMP = { 1: '#ffd23f', 2: '#fff', 3: '#fff', 4: '#fff', 5: '#ffe9c7' };
    const routes = Object.fromEntries([1, 2, 3, 4, 5].map((k) => [k, lignes(bm.roads[k] || [])]));
    for (const k of [5, 4, 3, 2, 1]) parts.push(`<path d="${routes[k]}" fill="none" stroke="#1b1b1b" stroke-opacity="${k >= 4 ? .45 : 1}" stroke-width="${LARG[k][0]}" stroke-linecap="round" stroke-linejoin="round"/>`);
    for (const k of [5, 4, 3, 2, 1]) parts.push(`<path d="${routes[k]}" fill="none" stroke="${REMP[k]}" stroke-width="${LARG[k][1]}" stroke-linecap="round" stroke-linejoin="round"/>`);
    // tram
    for (const l of tram.lines) {
      const d = lignes(anneaux(l.geom));
      parts.push(`<path d="${d}" fill="none" stroke="#1b1b1b" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".9"/><path d="${d}" fill="none" stroke="${l.colour}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`);
    }
    // halo jaune des quartiers, sous les points
    for (const q of QUARTIERS) { const [x, y] = px(q.at); parts.push(`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(330 * M)}" fill="#ffd23f" fill-opacity=".28" stroke="#1b1b1b" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".55"/>`); }
    // tous les lieux de l'application : un point de la couleur de leur catégorie
    const dansCadre = ven.venues.filter((v) => v.la > B.s && v.la < B.n && v.lo > B.o && v.lo < B.e);
    parts.push('<g stroke="#1b1b1b" stroke-width=".35">' + dansCadre.map((v) => { const [x, y] = px([v.la, v.lo]); return `<circle cx="${f1(x)}" cy="${f1(y)}" r="2" fill="${TYPES[v.t]?.color || '#999'}"/>`; }).join('') + '</g>');
    // arrêts de tram cités dans les quartiers
    const arrets = new Set(['Gare Saint-Jean', ...QUARTIERS.flatMap((q) => (q.tram || []).map((t) => t[1]))]);
    for (const s of tram.stops.filter((s) => arrets.has(s.name))) {
      const [x, y] = px([s.la, s.lo]);
      parts.push(`<circle cx="${f1(x)}" cy="${f1(y)}" r="4.2" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/>` +
        `<text x="${f1(x + 7)}" y="${f1(y + 3.4)}" font-family="Comic Neue" font-weight="700" font-size="10" stroke="#fff3d6" stroke-width="3" paint-order="stroke" fill="#1b1b1b">${s.name}</text>`);
    }
    // la Garonne
    const [gx, gy] = px([44.8565, -0.5535]);
    parts.push(`<text x="${f1(gx)}" y="${f1(gy)}" transform="rotate(-68 ${f1(gx)} ${f1(gy)})" text-anchor="middle" font-family="Bangers" font-size="24" letter-spacing="3" fill="#1d5f8c">LA GARONNE</text>`);
    // badges des quartiers : numéro et nom, en bulle de BD
    QUARTIERS.forEach((q, i) => {
      const [x, y] = px(q.at);
      const larg = q.nom.length * 7.6 + 18;
      parts.push(`<g transform="translate(${f1(x)} ${f1(y)})">` +
        `<rect x="10" y="-11" width="${f1(larg)}" height="22" rx="5" fill="#fff" stroke="#1b1b1b" stroke-width="1.8"/>` +
        `<text x="${f1(10 + larg / 2 + 4)}" y="6.5" text-anchor="middle" font-family="Bangers" font-size="17" letter-spacing=".6" fill="#1b1b1b">${q.nom.toUpperCase()}</text>` +
        `<circle r="15" fill="#ffd23f" stroke="#1b1b1b" stroke-width="2.4"/>` +
        `<text y="7.6" text-anchor="middle" font-family="Bangers" font-size="22" fill="#1b1b1b">${i + 1}</text></g>`);
    });
    // l'hôtel
    const [hx, hy] = px([HOTEL.la, HOTEL.lo]);
    const etoile = Array.from({ length: 24 }, (_, k) => { const r = k % 2 ? 11 : 21, a = (k * 15 - 90) * Math.PI / 180; return f1(r * Math.cos(a)) + ',' + f1(r * Math.sin(a)); }).join(' ');
    parts.push(`<g transform="translate(${f1(hx)} ${f1(hy)})"><polygon points="${etoile}" fill="#ff5a36" stroke="#1b1b1b" stroke-width="2.2" stroke-linejoin="round"/>` +
      `<text y="6.5" text-anchor="middle" font-family="Bangers" font-size="18" fill="#fff">H</text>` +
      `<text x="-26" y="-6" text-anchor="end" font-family="Bangers" font-size="15" letter-spacing=".5" stroke="#fff3d6" stroke-width="4" paint-order="stroke" fill="#c2410c">VOTRE HÔTEL</text>` +
      `<text x="-26" y="9" text-anchor="end" font-family="Comic Neue" font-weight="700" font-style="italic" font-size="11" stroke="#fff3d6" stroke-width="3.5" paint-order="stroke" fill="#c2410c">Your hotel</text></g>`);
    svg.innerHTML = parts.join('');

    // échelle : 500 m
    const echelle = document.getElementById('echelle');
    echelle.style.width = (500 * M / VW * 100) + '%';
    echelle.innerHTML = '<i></i>500 m';

    // ---------- légende ----------
    const LIBELLES = [['restaurant', 'Restaurants', 'Restaurants'], ['fastfood', 'Snacks, fast-food', 'Fast food'], ['cafe', 'Cafés, salons de thé', 'Cafés'],
      ['bar', 'Bars', 'Bars'], ['wine', 'Bars à vin', 'Wine bars'], ['pub', 'Pubs', 'Pubs'], ['club', 'Boîtes de nuit', 'Nightclubs']];
    document.getElementById('legende').innerHTML = '<b>Légende · <span class="en">Key</span></b><ul>' +
      LIBELLES.map(([t, fr, en]) => `<li><i style="background:${TYPES[t].color}"></i>${fr} · <span class="en">${en}</span></li>`).join('') +
      '<li><i class="q">1</i>Quartier · <span class="en">Area</span></li>' +
      `<li><i class="tram" style="background:${tram.lines.find((l) => l.ref === 'C').colour}"></i>Tram · <span class="en">Tramway</span></li>` +
      '<li><i class="h">H</i>Votre hôtel · <span class="en">Your hotel</span></li></ul>';

    // ---------- fiches des quartiers ----------
    const compte = Object.fromEntries(QUARTIERS.map((q) => [q.id, 0]));
    for (const v of ven.venues) {
      let best = null, bd = 650;
      for (const q of QUARTIERS) { const d = dist([v.la, v.lo], q.at); if (d < bd) { bd = d; best = q.id; } }
      if (best) compte[best]++;
    }
    const arrondi = (n) => (n >= 100 ? Math.floor(n / 50) * 50 : Math.floor(n / 10) * 10);
    const couleur = (ref) => tram.lines.find((l) => l.ref === ref)?.colour || '#333';
    const pastille = (ref) => `<b style="display:inline-block;min-width:3.6mm;padding:0 .7mm;border-radius:.8mm;background:${couleur(ref)};color:#fff;text-align:center;font-family:var(--titre);font-weight:400;letter-spacing:.03em">${ref}</b>`;
    const insecables = (s) => s.replace(/(\d) /g, '$1 ').replace(/ ([;:?!»])/g, ' $1').replace(/« /g, '« ');
    const html = QUARTIERS.map((q, i) => {
      const acces = [];
      if (q.id === 'saintjean') acces.push('<span>📍 autour de l’hôtel</span>');
      else if (q.marche && q.marche <= 40) acces.push(`<span>🚶 ${q.marche} min${q.pont ? ' par le pont de pierre' : ''}</span>`);
      if (q.tram) acces.push('<span>🚋 ' + q.tram.map(([l, a]) => `${pastille(l)} ${a}`).join(' puis ') + '</span>');
      return `<article class="q"><span class="num">${i + 1}</span><h3>${q.nom}</h3>` +
        `<p class="infos"><span>≈ ${arrondi(compte[q.id])} adresses</span> · ${acces.join(' · ')}</p><p>${insecables(q.texte)}</p></article>`;
    }).join('') +
      '<div class="q qr-carte"><p class="appel">Toutes les adresses !</p><p class="appel-en">Every address, in English · Free</p><div class="qr" id="qr"></div><p class="url" id="url"></p></div>';
    document.getElementById('quartiers').innerHTML = html;

    const qr = qrcode(0, 'M');
    qr.addData(URL_SITE); qr.make();
    document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    document.getElementById('url').innerHTML = URL_SITE.replace('https://', '').replace(/\?(.*)$/, '<wbr><span style="white-space:nowrap">?$1</span>'); // coupure avant « ?client », pas au milieu
    document.getElementById('hotel').textContent = HOTEL.name + ' · ' + HOTEL.addr;
    const date = new Date(ven.updated).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    document.getElementById('sources').innerHTML = `Plan et adresses · <span class="en">Map &amp; places</span> : OpenStreetMap (ODbL), ${date} · Temps à pied estimés · <span class="en">Walking times are estimates</span>`;
  </script>
</body>
</html>
